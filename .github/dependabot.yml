version: 2
updates:
  # Host workspace (root) — pico-signal, pico-host, embedded-data.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns:
          - "*"

  # Firmware crate: Raspberry Pi Pico (RP2040, thumbv6m) — own manifest.
  - package-ecosystem: cargo
    directory: "/firmware/rp-pico"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    groups:
      firmware-rp-pico:
        patterns:
          - "*"

  # The fuzz crate is a detached workspace (cargo-fuzz builds it on its own with
  # sanitizer flags), so the root cargo entry above does not reach it.
  - package-ecosystem: cargo
    directory: "/fuzz"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(fuzz)"
    groups:
      fuzz:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
