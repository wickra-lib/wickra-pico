name: Firmware

# The hardware gate. The RP2040 firmware is a workspace-excluded crate with its
# own linker script, target and `panic = "abort"` profile, so it is built here
# on its own: a real `thumbv6m-none-eabi` release build plus clippy and a size
# report. If this is red, the demo does not flash.
#
# The ESP32 variant (Xtensa, needs espup) and an on-device Renode/QEMU sim of
# the signal sequence are tracked in ROADMAP.md; they are not gated here yet.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"

jobs:
  rp2040:
    name: rp2040 (thumbv6m)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: firmware/rp-pico
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          targets: thumbv6m-none-eabi
          components: clippy, llvm-tools
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: firmware/rp-pico
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-binutils
      # Lint our firmware crate (HAL deps are not linted); -D warnings is set here,
      # not as a global RUSTFLAGS, so the HAL's own warnings don't fail the build.
      - run: cargo clippy --target thumbv6m-none-eabi --release -- -D warnings
      - run: cargo build --target thumbv6m-none-eabi --release
      # Size report: the release ELF must stay comfortably under the Pico's 2 MB
      # flash. Printed to the log as the demo's footprint record.
      - run: cargo size --target thumbv6m-none-eabi --release
