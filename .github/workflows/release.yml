name: Release

# This is a hardware demo, not a published library: there is nothing to push to
# crates.io / npm / PyPI. A release builds the flashable RP2040 firmware image
# (`.uf2`) plus the golden corpus and attaches them to a GitHub Release, so
# anyone can drag-drop the demo onto a Pico without a Rust toolchain.
#
# Fires only on a `v*` tag (an irreversible, maintainer-only step — USER-GO).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"

jobs:
  firmware-uf2:
    name: Build RP2040 .uf2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # SLSA build-provenance attestation for the .uf2
      attestations: write
    defaults:
      run:
        working-directory: firmware/rp-pico
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          targets: thumbv6m-none-eabi
      - uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145 # v2.83.1
        with:
          tool: elf2uf2-rs
      - name: Build release firmware
        run: cargo build --target thumbv6m-none-eabi --release
      - name: Convert ELF to UF2
        run: |
          elf2uf2-rs \
            target/thumbv6m-none-eabi/release/wickra-pico-rp-pico \
            wickra-pico-rp2040.uf2
      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: firmware/rp-pico/wickra-pico-rp2040.uf2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firmware-uf2
          path: firmware/rp-pico/wickra-pico-rp2040.uf2
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release
    needs: [firmware-uf2]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the release and upload the .uf2 + golden assets
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: firmware-uf2
          path: dist
      - name: Assemble release assets
        run: |
          cp golden/data/ema_cross.csv dist/
          cp golden/expected/ema_cross.txt dist/
          ls -la dist
      - uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          draft: true
          files: |
            dist/wickra-pico-rp2040.uf2
            dist/ema_cross.csv
            dist/ema_cross.txt
