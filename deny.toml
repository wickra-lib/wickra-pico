# cargo-deny configuration — supply-chain gate (advisories, licenses, bans, sources).
#
# Scope note: the `firmware/*` crates are workspace-EXCLUDED (own targets/linker),
# so `cargo deny check` audits the host workspace members. The firmware crates
# (embassy-rp / rp-hal / esp-hal) pull many transitive crates and are audited
# separately if needed.

[advisories]
version = 2
yanked = "deny"
# Suppressed advisories (assessed as not affecting wickra-pico). Keep in
# lock-step with osv-scanner.toml. Both are informational advisories on
# crates the RP2040 firmware lock pulls through rp2040-hal; the host
# workspace this file audits carries neither, and the entries are here so
# the two files stay one list.
ignore = [
    { id = "RUSTSEC-2026-0110", reason = "bare-metal is deprecated, not defective; cortex-m 0.7 in the RP2040 firmware lock only, nothing published carries it" },
    { id = "RUSTSEC-2024-0436", reason = "paste is an unmaintained compile-time proc-macro reached through rp2040-hal and pio in the RP2040 firmware lock; no code in the image" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
# Wildcards are denied.
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Every dependency comes from crates.io; no git source is allowed.
