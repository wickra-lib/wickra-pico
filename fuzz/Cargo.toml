[package]
name = "wickra-pico-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
# The kernel as the firmware links it: std off, allocation-free.
wickra-pico-signal = { path = "../crates/wickra-pico-signal", default-features = false }

# Detach from the parent workspace — cargo-fuzz builds this crate on its own with
# sanitizer flags on a nightly toolchain.
[workspace]

[[bin]]
name = "on_tick"
path = "fuzz_targets/on_tick.rs"
test = false
doc = false
bench = false
