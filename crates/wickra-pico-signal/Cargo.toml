[package]
name = "wickra-pico-signal"
description = "no_std EMA-cross signal engine over the wickra-embed-core indicator kernel — the shared, host-testable signal core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# `std` is on by default so host `cargo test`/`cargo build` are ready to go.
# Bare-metal firmware builds with `--no-default-features`, at which point the
# crate and its wickra-embed-core dependency are strictly `#![no_std]`.
default = ["std"]
std = ["wickra-embed-core/std"]

[dependencies]
wickra-embed-core = { workspace = true }

[dev-dependencies]
proptest = "1"
criterion = { workspace = true }

[[bench]]
name = "signal"
harness = false
